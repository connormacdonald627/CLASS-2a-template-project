[project]
name = "class-2a-template-project"
version = "0.1.0"
description = "CLASS-2a template project: a real-time, audio-driven interactive visualisation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "librosa",
    "pygame",
    "pyglet",
    "moderngl-window",
    "pillow",
    "pooch>=1.9.0",
    "appnope>=1.0.0",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
]

[tool.uv]
package = false
